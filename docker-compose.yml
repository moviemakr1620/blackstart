# Pull the published image (Portainer / Dockhand). To build from this folder
# instead, uncomment `build: .` below.
services:
  blackstart:
    image: ghcr.io/moviemakr1620/blackstart:latest
    # build: .
    container_name: blackstart
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      # Required. `docker compose` refuses to start if these are unset or empty.
      # Portainer: set them under the stack's Environment variables, or paste the
      # stack from deploy/docker.md and replace the placeholders there.
      BLACKSTART_SECRET_KEY: ${BLACKSTART_SECRET_KEY:?Set BLACKSTART_SECRET_KEY to a long random string}
      BLACKSTART_ADMIN_USER: ${BLACKSTART_ADMIN_USER:-admin}
      BLACKSTART_ADMIN_PASSWORD: ${BLACKSTART_ADMIN_PASSWORD:?Set BLACKSTART_ADMIN_PASSWORD to a strong password}
      BLACKSTART_DATA_DIR: /data
      BLACKSTART_PEANUT_URL: ${BLACKSTART_PEANUT_URL:-}
      BLACKSTART_NUT_HOST: ${BLACKSTART_NUT_HOST:-}
      BLACKSTART_NUT_DEVICE: ${BLACKSTART_NUT_DEVICE:-ecoflow}
    volumes:
      - blackstart-data:/data
      # Uncomment if this container should drive Docker on the same host:
      # - /var/run/docker.sock:/var/run/docker.sock
    # If peanut/NUT live on the Proxmox host network, host mode is the
    # least surprising way to reach them (and Wake-on-LAN).
    # network_mode: host

volumes:
  blackstart-data:
