# Builds the Blackstart image and publishes it to GitHub Container Registry on
# every push to main (and on version tags like v1.2.0). Portainer / Dockhand
# can then pull ghcr.io/moviemakr1620/blackstart:latest.
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Blackstart
            org.opencontainers.image.description=UPS-driven shutdown and restore controller for Proxmox, Synology, and Docker.
            org.opencontainers.image.licenses=MIT

      - id: buildmeta
        run: |
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^__version__ = \"\(.*\)\"/\1/p' backend/app/__init__.py | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BLACKSTART_GIT_COMMIT=${{ steps.buildmeta.outputs.commit }}
            BLACKSTART_BUILD_DATE=${{ steps.buildmeta.outputs.date }}
            BLACKSTART_VERSION=${{ steps.buildmeta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
